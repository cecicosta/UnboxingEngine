name: Publish Octree Ray Picking Lab

on:
  push:
    branches: [main, OpenGLRenderSystem]
    paths:
      - '.github/workflows/octree-pages.yml'
      - 'Examples/WebOctree/**'
      - 'LICENSE.TXT'
      - 'include/**'
      - 'source/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Examples/WebOctree
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Examples/WebOctree/package-lock.json
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.14'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Examples/WebOctree/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
