<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14191c">
    <title>Fields Simulation | UnboxingEngine</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%238ee4d6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ff856e'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./fields.css">
    <script type="importmap">
        {"imports":{"three":"../vendor/three.module.js"}}
    </script>
    <script type="module" src="./lab.mjs"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <a class="project" href="https://github.com/cecicosta/UnboxingEngine">UnboxingEngine</a>
            <h1>Fields Simulation</h1>
        </div>
        <nav class="sample-nav" aria-label="Interactive samples">
            <a href="../">Octree</a>
            <a href="../radiosity/">Radiosity</a>
            <a href="../voxelization/">Voxelization</a>
            <a href="./" aria-current="page">Fields</a>
        </nav>
    </header>
    <main class="workspace">
        <section class="viewport fields-viewport" id="viewport" aria-label="Field and flow comparison">
            <canvas id="scene" aria-label="Nucleus, electron field, and flow comparison from the GPU"></canvas>
            <div class="panels">
                <section aria-labelledby="field-label"><h2 id="field-label">Potential</h2><div class="image-area" id="potential"></div></section>
                <section aria-labelledby="flow-label"><h2 id="flow-label">Flow</h2><div class="image-area" id="flow"></div></section>
            </div>
            <p id="loader" class="loader" role="status">Initializing GPU&hellip;</p>
        </section>
        <aside class="inspector">
            <section aria-labelledby="render-heading">
                <h2 id="render-heading">Render settings</h2>
                <label class="select-row" for="resolution">Shader resolution
                    <select id="resolution" disabled>
                        <option value="64">64 &times; 64</option>
                        <option value="128" selected>128 &times; 128</option>
                        <option value="256">256 &times; 256</option>
                        <option value="512">512 &times; 512</option>
                        <option value="720">720 &times; 720</option>
                        <option value="1024">1024 &times; 1024</option>
                    </select>
                </label>
                <label class="select-row" for="flow-reference">Flow reference
                    <select id="flow-reference" disabled>
                        <option value="native" selected>Native wiring</option>
                        <option value="nucleus">Nucleus</option>
                    </select>
                </label>
            </section>
            <section aria-labelledby="feedback-heading">
                <div class="section-title">
                    <h2 id="feedback-heading">Feedback</h2>
                    <output id="status" aria-live="polite">Loading</output>
                </div>
                <div class="feedback-actions">
                    <button type="button" class="primary" id="run" disabled>Run</button>
                    <button type="button" id="step" disabled>Step</button>
                    <button type="button" id="reset" disabled>Reset</button>
                </div>
                <dl class="metrics">
                    <div><dt>Feedback steps</dt><dd id="iterations">0</dd></div>
                    <div><dt>Render target</dt><dd id="target-size">&ndash;</dd></div>
                    <div><dt>Texture format</dt><dd>RGBA32F</dd></div>
                </dl>
            </section>
            <footer><a href="../LICENSE.TXT">UnboxingEngine by Cecilia Costa</a></footer>
        </aside>
    </main>
</body>
</html>
