<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14191c">
    <title>Octree Ray Picking Lab | UnboxingEngine</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%238ee4d6' stroke-width='5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
        {"imports":{"three":"./vendor/three.module.js"}}
    </script>
    <script type="module" src="./lab.mjs"></script>
</head>
<body>
    <header class="topbar">
        <div>
            <a class="project" href="https://github.com/cecicosta/UnboxingEngine">UnboxingEngine</a>
            <h1>Octree Ray Picking Lab</h1>
        </div>
        <div class="runtime">C++ / WebAssembly</div>
    </header>
    <main class="workspace">
        <section id="viewport" class="viewport" aria-label="Interactive torus and octree">
            <canvas id="scene" aria-label="Torus, picking ray, and octree nodes"></canvas>
            <p id="loader" class="loader" role="status">Loading WebAssembly&hellip;</p>
            <div class="view-label">Orthographic</div>
        </section>
        <aside class="inspector">
            <section aria-labelledby="results-heading">
                <div class="section-title">
                    <h2 id="results-heading">Ray results</h2>
                    <output id="outcome" aria-live="polite">No ray</output>
                </div>
                <dl class="metrics">
                    <div><dt>Triangles tested</dt><dd id="tested">&ndash;</dd></div>
                    <div><dt>Octants visited</dt><dd id="visited">&ndash;</dd></div>
                    <div><dt>First hit triangle</dt><dd id="triangle">&ndash;</dd></div>
                    <div><dt>Hit distance</dt><dd id="distance">&ndash;</dd></div>
                </dl>
            </section>
            <section aria-labelledby="view-heading">
                <h2 id="view-heading">View</h2>
                <div class="views" role="group" aria-label="Camera presets">
                    <button type="button" id="isometric" disabled>Isometric</button>
                    <button type="button" id="side" disabled>Side</button>
                </div>
                <label class="option"><input id="all-nodes" type="checkbox" checked disabled> Show inactive octants</label>
                <ul class="legend" aria-label="Scene legend">
                    <li><span class="key torus"></span>Torus</li>
                    <li><span class="key ray"></span>Ray</li>
                    <li><span class="key visited"></span>Visited octant</li>
                    <li><span class="key candidate"></span>Candidate octant</li>
                    <li><span class="key hit"></span>First hit</li>
                </ul>
            </section>
            <div class="actions">
                <button type="button" class="primary" id="sample" disabled>Fire sample ray</button>
                <button type="button" id="clear" disabled>Clear ray</button>
            </div>
            <footer><a href="./LICENSE.TXT">UnboxingEngine by Cecilia Costa</a></footer>
        </aside>
    </main>
</body>
</html>
